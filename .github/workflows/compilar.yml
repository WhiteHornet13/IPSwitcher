# =============================================================================
# .github/workflows/compilar.yml
# =============================================================================
# Pipeline CI/CD para IPSwitcher.
#
# Jobs:
#   1. build-linux          → Portable Linux + paquete .deb
#   2. build-windows        → .exe portable Windows 10/11
#   3. build-windows-xp     → .exe portable Windows XP  (Python 2.7 + cx_Freeze)
#   4. build-windows-xp-nsi → Instalador NSIS Windows XP
#   5. release              → GitHub Release con dos carpetas:
#                               portables/    → ejecutables sueltos
#                               instaladores/ → .deb y Setup.exe
#
# Se activa:
#   - Push a main/master        → compila, NO publica release
#   - Push de tag v*            → compila Y publica release
#   - Pull request a main/master → sólo compila
#   - workflow_dispatch          → lanzado manualmente desde la UI
# =============================================================================

name: Compilar IPSwitcher

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME:    "IPSwitcher"
  APP_VERSION: "1.0.0"
  PYTHON_VER:  "3.10"

# =============================================================================
# JOB 1 — Linux portable + .deb
# =============================================================================
jobs:
  build-linux:
    name: "🐧 Linux — portable + .deb"
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python ${{ env.PYTHON_VER }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VER }}

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev \
            python3-tk \
            binutils

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Compilar ejecutable portable Linux
        run: |
          mkdir -p dist/linux
          python -m PyInstaller \
            --onefile \
            --name "${{ env.APP_NAME }}" \
            --add-data "ips.json:." \
            --distpath dist/linux \
            --workpath build/pyinstaller \
            --specpath build \
            --clean \
            --noconfirm \
            src/ipswitcher.py

      - name: Crear paquete .deb
        run: |
          ARCH="amd64"
          PKG_NAME="ipswitcher"
          PKG_DIR="build/deb/${PKG_NAME}_${APP_VERSION}_${ARCH}"

          mkdir -p "${PKG_DIR}/DEBIAN"
          mkdir -p "${PKG_DIR}/usr/bin"
          mkdir -p "${PKG_DIR}/usr/share/applications"
          mkdir -p "${PKG_DIR}/usr/share/${PKG_NAME}"
          mkdir -p "${PKG_DIR}/usr/share/doc/${PKG_NAME}"

          cp "dist/linux/${{ env.APP_NAME }}" "${PKG_DIR}/usr/bin/${PKG_NAME}"
          chmod 755 "${PKG_DIR}/usr/bin/${PKG_NAME}"

          cp ips.json "${PKG_DIR}/usr/share/${PKG_NAME}/ips.json"
          chmod 644 "${PKG_DIR}/usr/share/${PKG_NAME}/ips.json"

          cat > "${PKG_DIR}/usr/share/applications/${PKG_NAME}.desktop" << 'DESKTOP'
[Desktop Entry]
Name=IPSwitcher
Comment=Herramienta para cambiar la IPv4 de adaptadores de red
Exec=pkexec /usr/bin/ipswitcher
Icon=network-wired
Terminal=false
Type=Application
Categories=Network;Settings;
Keywords=IP;Network;Switch;IPv4;
DESKTOP
          chmod 644 "${PKG_DIR}/usr/share/applications/${PKG_NAME}.desktop"

          cat > "${PKG_DIR}/DEBIAN/postinst" << 'POSTINST'
#!/bin/sh
set -e
if command -v update-desktop-database > /dev/null 2>&1; then
    update-desktop-database -q /usr/share/applications || true
fi
POSTINST
          chmod 755 "${PKG_DIR}/DEBIAN/postinst"

          echo "Upstream-Name: IPSwitcher" > "${PKG_DIR}/usr/share/doc/${PKG_NAME}/copyright"
          gzip --best -n -c /dev/null > "${PKG_DIR}/usr/share/doc/${PKG_NAME}/changelog.gz"

          INSTALLED_SIZE=$(du -sk "${PKG_DIR}/usr" | cut -f1)
          cat > "${PKG_DIR}/DEBIAN/control" << CONTROL
Package: ${PKG_NAME}
Version: ${APP_VERSION}
Architecture: ${ARCH}
Maintainer: IPSwitcher Project <ipswitcher@example.com>
Installed-Size: ${INSTALLED_SIZE}
Depends: libgtk-3-0
Section: net
Priority: optional
Homepage: https://github.com/WhiteHornet13/IPSwitcher
Description: Herramienta para cambiar la IPv4 de adaptadores de red
 IPSwitcher permite seleccionar un adaptador de red y aplicar
 configuraciones IP fijas almacenadas en un archivo JSON.
CONTROL

          dpkg-deb --build --root-owner-group \
            "${PKG_DIR}" "dist/linux/${PKG_NAME}_${APP_VERSION}_${ARCH}.deb"
        env:
          APP_VERSION: ${{ env.APP_VERSION }}

      - name: Subir artefactos Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist/linux/IPSwitcher
            dist/linux/ipswitcher_*.deb
          retention-days: 30

  # ===========================================================================
  # JOB 2 — Windows 10/11 portable .exe
  # ===========================================================================
  build-windows:
    name: "🪟 Windows 10/11 — portable .exe"
    runs-on: windows-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python ${{ env.PYTHON_VER }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VER }}

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
        shell: pwsh

      - name: Compilar IPSwitcher.exe
        run: |
          New-Item -ItemType Directory -Force -Path dist\windows | Out-Null
          python -m PyInstaller `
            --onefile `
            --windowed `
            --name "${{ env.APP_NAME }}" `
            --add-data "ips.json;." `
            --distpath dist\windows `
            --workpath build\pyinstaller_win `
            --specpath build `
            --clean `
            --noconfirm `
            src\ipswitcher.py
        shell: pwsh

      - name: Subir artefacto Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist\windows\IPSwitcher.exe
          retention-days: 30

  # ===========================================================================
  # JOB 3 — Windows XP portable .exe  (Python 2.7 + cx_Freeze)
  # ===========================================================================
  build-windows-xp:
    name: "🪟 Windows XP — portable .exe"
    runs-on: windows-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Instalar Python 2.7.18
        run: |
          $url = "https://www.python.org/ftp/python/2.7.18/python-2.7.18.amd64.msi"
          $out = "$env:TEMP\python27.msi"
          Invoke-WebRequest -Uri $url -OutFile $out
          Start-Process msiexec.exe -Wait `
            -ArgumentList "/i $out /quiet /norestart TARGETDIR=C:\Python27 ADDLOCAL=ALL"
          "C:\Python27;C:\Python27\Scripts" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Instalar cx_Freeze 5.1.1
        run: |
          C:\Python27\python.exe -m pip install --upgrade pip
          C:\Python27\python.exe -m pip install cx_Freeze==5.1.1
        shell: pwsh

      - name: Compilar IPSwitcherXP (portable)
        run: |
          New-Item -ItemType Directory -Force -Path dist\windowsXP | Out-Null
          C:\Python27\python.exe setup_xp.py build
        shell: pwsh

      - name: Subir artefacto XP portable
        uses: actions/upload-artifact@v4
        with:
          name: windows-xp-portable
          path: dist\windowsXP\IPSwitcherXP\
          retention-days: 30

  # ===========================================================================
  # JOB 4 — Windows XP instalador NSIS
  # ===========================================================================
  build-windows-xp-nsi:
    name: "🪟 Windows XP — instalador NSIS"
    runs-on: windows-latest
    needs: build-windows-xp

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Descargar artefacto XP portable
        uses: actions/download-artifact@v4
        with:
          name: windows-xp-portable
          path: dist\windowsXP\IPSwitcherXP

      - name: Instalar NSIS
        run: choco install nsis --yes --no-progress
        shell: pwsh

      - name: Asegurar archivo LICENSE
        run: |
          if (-not (Test-Path "LICENSE")) {
            Set-Content -Path "LICENSE" -Value "MIT License - IPSwitcher Project"
          }
        shell: pwsh

      - name: Compilar instalador NSIS
        run: |
          New-Item -ItemType Directory -Force -Path dist\windowsXP | Out-Null
          & "C:\Program Files (x86)\NSIS\makensis.exe" /V2 installer_xp.nsi
        shell: pwsh

      - name: Subir instalador XP
        uses: actions/upload-artifact@v4
        with:
          name: windows-xp-installer
          path: dist\windowsXP\IPSwitcherXP_*_Setup.exe
          retention-days: 30

  # ===========================================================================
  # JOB 5 — Publicar Release  (sólo en push de tag v*)
  #
  # Estructura del release en GitHub:
  #   portables/
  #     IPSwitcher_vX.X.X_linux_amd64         ← Linux portable
  #     IPSwitcher_vX.X.X_windows.exe         ← Windows 10/11 portable
  #     IPSwitcherXP_vX.X.X_WindowsXP.zip     ← Windows XP portable (ZIP)
  #   instaladores/
  #     ipswitcher_X.X.X_amd64.deb            ← Linux paquete .deb
  #     IPSwitcherXP_X.X.X_Setup.exe          ← Windows XP instalador NSIS
  # ===========================================================================
  release:
    name: "🚀 Publicar Release"
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows
      - build-windows-xp
      - build-windows-xp-nsi
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Descargar artefactos Linux
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: _raw/linux

      - name: Descargar artefactos Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: _raw/windows

      - name: Descargar artefactos XP portable
        uses: actions/download-artifact@v4
        with:
          name: windows-xp-portable
          path: _raw/windowsXP-portable

      - name: Descargar instalador XP
        uses: actions/download-artifact@v4
        with:
          name: windows-xp-installer
          path: _raw/windowsXP-installer

      # ── Organizar en portables/ e instaladores/ ──────────────────────────────
      - name: Organizar artefactos en carpetas
        run: |
          TAG="${{ github.ref_name }}"

          mkdir -p release-assets/portables
          mkdir -p release-assets/instaladores

          # ── portables/ ───────────────────────────────────────────────────────

          # Linux portable
          cp "_raw/linux/IPSwitcher" \
             "release-assets/portables/IPSwitcher_${TAG}_linux_amd64"
          chmod +x "release-assets/portables/IPSwitcher_${TAG}_linux_amd64"

          # Windows 10/11 portable
          cp "_raw/windows/IPSwitcher.exe" \
             "release-assets/portables/IPSwitcher_${TAG}_windows.exe"

          # Windows XP portable → ZIP
          cd _raw/windowsXP-portable
          zip -r "../../release-assets/portables/IPSwitcherXP_${TAG}_WindowsXP.zip" .
          cd ../..

          # ── instaladores/ ────────────────────────────────────────────────────

          # Linux .deb
          DEB=$(ls _raw/linux/*.deb 2>/dev/null | head -1)
          [[ -n "${DEB}" ]] && cp "${DEB}" "release-assets/instaladores/$(basename ${DEB})"

          # Windows XP Setup.exe
          NSIS=$(ls _raw/windowsXP-installer/*.exe 2>/dev/null | head -1)
          [[ -n "${NSIS}" ]] && cp "${NSIS}" "release-assets/instaladores/$(basename ${NSIS})"

          # ── Resumen ──────────────────────────────────────────────────────────
          echo ""
          echo "=== portables/ ==="
          ls -lh release-assets/portables/
          echo ""
          echo "=== instaladores/ ==="
          ls -lh release-assets/instaladores/

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "IPSwitcher ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## IPSwitcher ${{ github.ref_name }}

            ---

            ### 📦 Portables — ejecuta sin instalar

            | Plataforma        | Archivo                                    |
            |-------------------|--------------------------------------------|
            | 🐧 Linux          | `portables/IPSwitcher_*_linux_amd64`       |
            | 🪟 Windows 10/11  | `portables/IPSwitcher_*_windows.exe`       |
            | 🪟 Windows XP     | `portables/IPSwitcherXP_*_WindowsXP.zip`  |

            ### 🔧 Instaladores — instalan en el sistema

            | Plataforma        | Archivo                                    |
            |-------------------|--------------------------------------------|
            | 🐧 Linux          | `instaladores/ipswitcher_*.deb`            |
            | 🪟 Windows XP     | `instaladores/IPSwitcherXP_*_Setup.exe`   |

            ---

            ### Instalación rápida

            **Linux (.deb):**
            ```bash
            sudo dpkg -i ipswitcher_*.deb
            ```
            **Linux (portable):**
            ```bash
            chmod +x IPSwitcher_*_linux_amd64
            sudo ./IPSwitcher_*_linux_amd64
            ```
            **Windows 10/11:** clic derecho → Ejecutar como administrador.

            **Windows XP (portable):** extraer el ZIP y ejecutar `IPSwitcherXP.exe` como administrador.

            **Windows XP (instalador):** doble clic en `Setup.exe` y seguir el asistente.

            ---

            Ver [CHANGELOG.md](https://github.com/WhiteHornet13/IPSwitcher/blob/main/CHANGELOG.md) para los cambios de esta versión.
          files: |
            release-assets/portables/*
            release-assets/instaladores/*
          token: ${{ secrets.GITHUB_TOKEN }}
